# To switch this on: gh auth refresh -h github.com -s workflow (approve in the browser), then
#   git mv docs/ci/ci.yml .github/workflows/ci.yml && git commit -m 'ci: enable' && git push
# It sits in docs/ci until then because GitHub refuses a push that adds a workflow when the
# token has no workflow scope. Actions are pinned to commit SHAs, the version is in the comment.
#
# Every push and pull request: the same checks as `make check`, plus a contract check that fails
# when the API schema and the frontend's generated types disagree; the database tests and the API
# suite in database mode against the same compose.yaml a server runs; and on main, the whole system
# built and run from a fresh clone (make smoke). Synthetic data only. The database's passwords are
# made up for each run and thrown away with it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: backend
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: No known vulnerabilities in the locked dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt --no-deps --disable-pip
      - name: API contract matches the committed schema
        run: |
          uv run python ../scripts/export_openapi.py
          git diff --exit-code -- openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: No known vulnerabilities in what ships
        run: pnpm audit --prod
      - name: Types generated from the committed API schema
        run: |
          pnpm types
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  database:
    # the tests that need PostgreSQL, and the API tests again with the app keeping everything in it
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: backend
          python-version: "3.12"
      - name: Passwords for a throwaway database
        run: |
          {
            echo "EDSS_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "EDSS_DB_APP_PASSWORD=$(openssl rand -hex 24)"
          } > .env
          chmod 600 .env
      - name: PostgreSQL with pgvector, from compose.yaml
        run: docker compose --env-file .env up -d --wait db
      - name: Install
        working-directory: backend
        run: uv sync --frozen
      - name: Migrate, the app role, the checkpoint tables
        run: make db-migrate
      - name: Database tests, failing rather than skipping
        run: make test-db
      - name: The API tests in database mode
        run: make test-api-db

  containers:
    # both images built and the whole system run from a fresh clone: up, a brief to review, the
    # audit chain, a backup restored, down. Slower, so on main only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the smoke test clones this checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: backend
          python-version: "3.12"
      - name: Install the backend, for the smoke test's own checks
        working-directory: backend
        run: uv sync --frozen
      - name: From a fresh clone
        run: make smoke

  e2e:
    # the approval flow, the demo's fault injection, scoping, sign-in, keyboard use and an axe scan,
    # against the real API and pages. The tests start their own servers on spare ports.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: backend
          python-version: "3.12"
      - name: Install the backend
        working-directory: backend
        run: uv sync --frozen
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install the frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install the browser the tests drive
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: pnpm e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
