<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>The agent graph, one run</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 36px; font-weight: 700; fill: #1f2933; }
    .sub { font-size: 21px; fill: #52606d; }
    .h { font-size: 21px; font-weight: 600; fill: #1f2933; }
    .t { font-size: 18px; fill: #3e4c59; }
    .s { font-size: 17px; fill: #52606d; }
    .lab { font-size: 17px; fill: #3e4c59; font-style: italic; }
    .box { fill: #ffffff; stroke: #9aa5b1; stroke-width: 2; }
    .model { fill: #fffbeb; stroke: #b45309; stroke-width: 2; }
    .people { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .done { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; }
    .arrow { stroke: #52606d; stroke-width: 2.5; fill: none; marker-end: url(#a); }
  </style>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text class="title" x="48" y="66">The agent graph, one run</text>
  <text class="sub" x="48" y="104">Built with LangGraph. Only the amber steps use the language model. The rest is plain, tested code, or a person.</text>

  <!-- top row, left to right -->
  <rect class="people" x="48" y="200" width="168" height="120" rx="10"/>
  <text class="h" x="64" y="236">Request</text>
  <text class="t" x="64" y="268">in plain words</text>

  <rect class="model" x="240" y="200" width="168" height="120" rx="10"/>
  <text class="h" x="256" y="236">Clarify</text>
  <text class="t" x="256" y="268">asks only what</text>
  <text class="t" x="256" y="294">is missing</text>

  <rect class="model" x="432" y="200" width="168" height="120" rx="10"/>
  <text class="h" x="448" y="236">Plan</text>
  <text class="t" x="448" y="264">the model drafts,</text>
  <text class="t" x="448" y="288">a person edits</text>
  <text class="t" x="448" y="312">and locks it</text>

  <rect class="box" x="624" y="200" width="168" height="120" rx="10"/>
  <text class="h" x="640" y="236">Access check</text>
  <text class="t" x="640" y="268">a scope for</text>
  <text class="t" x="640" y="294">each area</text>

  <text class="lab" x="836" y="418">in parallel</text>
  <rect class="box" x="816" y="130" width="168" height="56" rx="10"/>
  <text class="h" x="832" y="166">Academic</text>
  <rect class="box" x="816" y="198" width="168" height="56" rx="10"/>
  <text class="h" x="832" y="234">Research</text>
  <rect class="box" x="816" y="266" width="168" height="56" rx="10"/>
  <text class="h" x="832" y="302">Placement</text>
  <rect class="box" x="816" y="334" width="168" height="56" rx="10"/>
  <text class="h" x="832" y="370">Finance</text>

  <rect class="box" x="1008" y="200" width="168" height="120" rx="10"/>
  <text class="h" x="1024" y="236">KPI synthesis</text>
  <text class="t" x="1024" y="268">targets, status</text>
  <text class="t" x="1024" y="294">and variance</text>

  <rect class="model" x="1200" y="200" width="168" height="120" rx="10"/>
  <text class="h" x="1216" y="236">Options</text>
  <text class="t" x="1216" y="264">and risks, for</text>
  <text class="t" x="1216" y="288">each KPI that</text>
  <text class="t" x="1216" y="312">is off target</text>

  <rect class="box" x="1392" y="200" width="168" height="120" rx="10"/>
  <text class="h" x="1408" y="236">Compose</text>
  <text class="t" x="1408" y="268">the brief</text>

  <path class="arrow" d="M216,260 H236"/>
  <path class="arrow" d="M408,260 H428"/>
  <path class="arrow" d="M600,260 H620"/>
  <path class="arrow" d="M792,260 C800,260 800,158 812,158"/>
  <path class="arrow" d="M792,260 C802,260 802,226 812,226"/>
  <path class="arrow" d="M792,260 C802,260 802,294 812,294"/>
  <path class="arrow" d="M792,260 C800,260 800,362 812,362"/>
  <path class="arrow" d="M984,158 C996,158 996,260 1004,260"/>
  <path class="arrow" d="M984,226 C994,226 994,260 1004,260"/>
  <path class="arrow" d="M984,294 C994,294 994,260 1004,260"/>
  <path class="arrow" d="M984,362 C996,362 996,260 1004,260"/>
  <path class="arrow" d="M1176,260 H1196"/>
  <path class="arrow" d="M1368,260 H1388"/>

  <!-- bottom row, right to left -->
  <path class="arrow" d="M1476,320 V516"/>
  <polygon points="1476,520 1572,600 1476,680 1380,600" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/>
  <text class="h" x="1476" y="596" text-anchor="middle">Validate</text>
  <text class="t" x="1476" y="622" text-anchor="middle">V1 to V9</text>

  <rect class="model" x="1100" y="740" width="200" height="100" rx="10"/>
  <text class="h" x="1116" y="776">Repair</text>
  <text class="t" x="1116" y="806">only the part</text>
  <text class="t" x="1116" y="830">that failed</text>
  <path class="arrow" d="M1476,680 V790 H1304"/>
  <text class="lab" x="1316" y="822">a check failed, attempts left</text>
  <text class="lab" x="1316" y="846">(at most 3 attempts)</text>
  <path class="arrow" d="M1200,740 V644 H1424"/>

  <rect class="people" x="820" y="540" width="220" height="120" rx="10"/>
  <text class="h" x="836" y="576">Human gate</text>
  <text class="t" x="836" y="606">a named approver</text>
  <text class="t" x="836" y="632">decides. The run waits</text>
  <path class="arrow" d="M1380,600 H1044"/>
  <text class="lab" x="1070" y="560">all passed, or out of attempts</text>
  <text class="lab" x="1070" y="584">(escalated with a diagnosis)</text>

  <rect class="people" x="420" y="470" width="260" height="84" rx="10"/>
  <text class="h" x="436" y="504">Approve, or edit</text>
  <text class="t" x="436" y="532">edits are checked again</text>
  <rect class="people" x="420" y="570" width="260" height="60" rx="10"/>
  <text class="h" x="436" y="608">Send back</text>
  <rect class="people" x="420" y="646" width="260" height="84" rx="10"/>
  <text class="h" x="436" y="680">Override</text>
  <text class="t" x="436" y="708">a reason is required</text>
  <path class="arrow" d="M820,600 C760,600 760,512 684,512"/>
  <path class="arrow" d="M820,600 H684"/>
  <path class="arrow" d="M820,600 C760,600 760,688 684,688"/>

  <rect class="done" x="48" y="470" width="300" height="84" rx="10"/>
  <text class="h" x="64" y="504">Publish a version</text>
  <text class="t" x="64" y="532">immutable, current</text>
  <path class="arrow" d="M420,512 H352"/>

  <!-- legend -->
  <rect class="box" x="48" y="800" width="28" height="28" rx="6"/>
  <text class="s" x="88" y="821">plain code</text>
  <rect class="model" x="210" y="800" width="28" height="28" rx="6"/>
  <text class="s" x="250" y="821">language model</text>
  <rect class="people" x="420" y="800" width="28" height="28" rx="6"/>
  <text class="s" x="460" y="821">a person</text>
</svg>
